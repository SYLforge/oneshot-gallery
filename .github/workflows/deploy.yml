name: Deploy

# Build on GitHub Actions and deploy the result to Vercel, bypassing Vercel's
# own build environment (which cannot currently reach fonts.gstatic.com).
#
# Fonts: next/font/google fetches ~50 font families at build time. Each fetch
# is retried up to 8× with backoff (scripts/font-fetch-retry.cjs preloaded via
# NODE_OPTIONS), and successful downloads are cached in .next/cache so a retry
# converges. We persist that cache across runs.
#
# Repo secrets required: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Preload the font-fetch retry shim so transient Google Fonts network
      # errors are retried with exponential backoff before failing the build.
      NODE_OPTIONS: "--require ./scripts/font-fetch-retry.cjs"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm registry:build

      - name: Validate
        run: pnpm validate

      # Persist next/font's build-time font cache so a retried run does not
      # re-download fonts that already succeeded.
      - name: Restore font cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-fonts-${{ runner.os }}-${{ hashFiles('registry/designs/*/fonts.ts') }}
          restore-keys: |
            next-fonts-${{ runner.os }}-

      - name: Build site
        # Triple-retry: each attempt caches whatever fonts it fetched, so the
        # next attempt only needs the ones that failed.
        run: pnpm build || pnpm build || pnpm build

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output
        run: vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (prebuilt, production)
        run: vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
